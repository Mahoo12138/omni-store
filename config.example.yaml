# OmniStore 配置示例（README §4.3）
# 配置优先级：程序默认值 < YAML 配置文件 < 环境变量（OMNISTORE_ 前缀）
# 修改后需重启服务，不支持热加载。

server:
  http_addr: "0.0.0.0:8080"
  public_url: "https://store.example.com"
  trusted_proxies:
    - "127.0.0.1"
    - "172.16.0.0/12"
  # 1.0.0 / V1 S3 兼容接口；默认关闭，启用后使用独立端口和 Path-style URL
  s3_addr: "0.0.0.0:8081"
  s3_enabled: false

data:
  dir: "/data"

database:
  path: "" # 为空时使用 data.dir/omnistore.db

security:
  cookie_secure: true
  session_ttl_hours: 168
  login_rate_limit:
    enabled: true
    window_minutes: 15
    max_failures_per_ip: 50
    max_failures_per_username: 10
  # S3 master key 只能通过 OMNISTORE_MASTER_KEY 提供，不写入 YAML。
  # 未提供时首次创建 S3 凭据会生成 data.dir/keys/s3-master.key，请务必备份。
  # 首次管理员初始化凭据只通过 OMNISTORE_BOOTSTRAP_TOKEN 提供，不写入 YAML。
  # 未提供时服务会随机生成，并在空数据库首次启动时写入日志。

upload:
  max_file_size_mb: 1024

image_bed:
  root_path: "/images"
  user_max_file_size_mb: 20
  anonymous_max_file_size_mb: 10
  anonymous_rate_limit:
    enabled: true
    per_ip_per_hour: 60

audit:
  enabled: true
  max_entries: 10000

log:
  level: "info"
