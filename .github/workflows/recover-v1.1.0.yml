name: Recover v1.1.0 image

on:
  workflow_dispatch:
    inputs:
      assets_only:
        description: Publish the validated binary artifacts after the image is available
        type: boolean
        default: false

jobs:
  image:
    name: Publish v1.1.0 multiarch image
    if: ${{ !inputs.assets_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: v1.1.0
          path: release-src

      - name: Check out cross-build Dockerfile
        uses: actions/checkout@v6
        with:
          ref: main
          path: build-tools

      - name: Verify release source
        id: release
        shell: bash
        run: |
          test "$(git -C release-src rev-parse HEAD)" = 2a05e12435a8425c95c025fe4656fbce3983e81f
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for runtime image steps
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stable image
        uses: docker/build-push-action@v7
        with:
          context: ./release-src
          file: ./build-tools/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mahoo12138/omni-store:1.1.0
            ghcr.io/mahoo12138/omni-store:1.1
            ghcr.io/mahoo12138/omni-store:1
            ghcr.io/mahoo12138/omni-store:latest
          labels: |
            org.opencontainers.image.title=OmniStore
            org.opencontainers.image.description=Unified file storage and image hosting service
            org.opencontainers.image.version=1.1.0
            org.opencontainers.image.revision=2a05e12435a8425c95c025fe4656fbce3983e81f
          build-args: |
            VERSION=1.1.0
            COMMIT=2a05e12435a8425c95c025fe4656fbce3983e81f
            BUILD_DATE=${{ steps.release.outputs.build_time }}

  assets:
    name: Publish validated v1.1.0 archives
    if: ${{ inputs.assets_only }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated binary archives
        uses: actions/download-artifact@v4
        with:
          run-id: 36152473760
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Create and check release checksums
        working-directory: release-assets
        run: |
          test -s omnistore_1.1.0_linux_amd64.tar.gz
          test -s omnistore_1.1.0_linux_arm64.tar.gz
          sha256sum *.tar.gz > checksums.txt
          sha256sum -c checksums.txt

      - name: Verify stable image is available
        run: docker manifest inspect ghcr.io/mahoo12138/omni-store:1.1.0 >/dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.1.0 >/dev/null
          gh release upload v1.1.0 release-assets/* --clobber
          gh release edit v1.1.0 --draft=false --prerelease=false
